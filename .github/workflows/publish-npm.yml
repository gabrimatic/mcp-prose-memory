name: Publish npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Runs on every trigger so a manual dispatch from a branch cannot publish.
      - name: Check tag matches package version
        run: |
          node -e 'if (process.env.GITHUB_REF_TYPE !== "tag") throw new Error("Publishing requires a v* tag ref"); const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ""); const pkg = require("./package.json"); if (pkg.version !== tag) throw new Error("Tag v" + tag + " does not match package version " + pkg.version);'

      # prepublishOnly runs the full package check (build, tests, audit, pack).
      - name: Publish package
        run: npm publish --access public
